# Required repo secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# The site serves the catalog from committed public/catalog/*.json, not from a
# live DB scan, so scraping alone does not change what users see. This workflow
# scrapes, rebuilds those dumps, and commits them; the commit is what deploys.
# If schedules stop after repo inactivity: Actions → ... → enable workflows; run once via workflow_dispatch.
name: Refresh Course Data
on:
  schedule:
    - cron: '0 14 * * *' # 6:00 PT (14:00 UTC during PST; 13:00 UTC during PDT)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/scrape-sections.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Rebuild catalog dumps
        run: node scripts/dump-catalog.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit refreshed dumps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog/light.json public/catalog/full.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged; nothing to deploy."
          else
            git commit -m 'chore: refresh catalog dumps'
            git push
            echo "Pushed refreshed catalog; Vercel deploys from the commit."
          fi
